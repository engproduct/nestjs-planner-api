name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, unit e e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: planner-api

    services:
      postgres:
        image: postgres:16.0-alpine
        env:
          POSTGRES_USER: api_user_test
          POSTGRES_PASSWORD: api_pass_test
          POSTGRES_DB: planner_db_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U api_user_test -d planner_db_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Variáveis do processo têm precedência; no CI não existe .env.test.
    env:
      DB_HOST: localhost
      DB_PORT: 5433
      DB_USER: api_user_test
      DB_PASSWORD: api_pass_test
      DB_NAME: planner_db_test
      DB_SCHEMA: public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: planner-api/yarn.lock

      - run: yarn install --frozen-lockfile

      - run: yarn lint

      - run: yarn test

      - run: yarn test:e2e
