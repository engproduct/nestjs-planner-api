name: PR template

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate PR description
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.pull_request.body ?? '')
              .replace(/<!--[\s\S]*?-->/g, '')
              .replace(/\r\n/g, '\n');

            const section = (title) => {
              const match = body.match(new RegExp(`^## ${title}[ \\t]*\\n([\\s\\S]*?)(?=^## |(?![\\s\\S]))`, 'm'));
              return match ? match[1] : null;
            };
            const meaningful = (text) =>
              text.replace(/<br\s*\/?>/gi, '').trim().length > 0;

            const errors = [];
            const motivo = section('Motivo');
            const comoTestar = section('Como Testar');

            if (motivo === null) {
              errors.push('Seção "## Motivo" ausente.');
            } else {
              const link = /\[Tarefa no project\]\((https:\/\/github\.com\/[^)\s]*projects\/[^)\s]+)\)/;
              if (!link.test(motivo)) {
                errors.push('"## Motivo" deve conter [Tarefa no project](<url do item no GitHub Project>).');
              }
              const definicao = motivo.replace(/\[Tarefa no project\]\([^)]*\)/, '');
              if (/#\{[^}]*\}/.test(definicao) || !meaningful(definicao)) {
                errors.push('"## Motivo" deve trazer a definição da tarefa (substitua o placeholder #{...}).');
              }
            }

            if (comoTestar === null) {
              errors.push('Seção "## Como Testar" ausente.');
            } else if (/#\{[^}]*\}/.test(comoTestar) || !meaningful(comoTestar)) {
              errors.push('"## Como Testar" deve descrever como testar (substitua o placeholder #{...}).');
            }

            if (errors.length > 0) {
              core.setFailed(
                'A descrição do PR não segue .github/pull_request_template.md:\n- ' + errors.join('\n- '),
              );
            }

  changelog:
    name: Require CHANGELOG and version bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const errors = [];
            if (!files.some((f) => f.filename === 'planner-api/CHANGELOG.md')) {
              errors.push('Atualize planner-api/CHANGELOG.md.');
            }

            const versionAt = async (ref) => {
              const { data } = await github.rest.repos.getContent({
                owner,
                repo,
                path: 'planner-api/package.json',
                ref,
              });
              return JSON.parse(Buffer.from(data.content, 'base64').toString()).version;
            };
            const base = await versionAt(pr.base.sha);
            const head = await versionAt(pr.head.sha);
            if (base === head) {
              errors.push(`Incremente "version" em planner-api/package.json (continua ${head}).`);
            }

            const { data: changelog } = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'planner-api/CHANGELOG.md',
              ref: pr.head.sha,
            });
            const text = Buffer.from(changelog.content, 'base64').toString();
            const esc = head.replace(/\./g, '\\.');
            if (!new RegExp(`^## \\[${esc}\\]`, 'm').test(text)) {
              errors.push(`Adicione a seção "## [${head}]" no CHANGELOG.`);
            }
            if (!new RegExp(`^\\[${esc}\\]: https://github\\.com/${owner}/${repo}/compare/v\\S+\\.\\.\\.v${esc}$`, 'm').test(text)) {
              errors.push(`Adicione o link "[${head}]: https://github.com/${owner}/${repo}/compare/v<anterior>...v${head}" no rodapé do CHANGELOG.`);
            }

            if (errors.length > 0) {
              core.setFailed('Release incompleto (ver CLAUDE.md, passo "Release"):\n- ' + errors.join('\n- '));
            }
