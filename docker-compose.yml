name: planner

networks:
  network-planner:
    driver: bridge

volumes:
  postgres-planner-data:
  test-postgres-planner-data:

services:
  postgres-planner:
    image: postgres:16.0-alpine
    container_name: postgres-planner
    hostname: postgres-planner
    environment:
      POSTGRES_USER: api_user
      POSTGRES_PASSWORD: api_pass
      POSTGRES_DB: planner_db
      PGTZ: America/Sao_Paulo
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres-planner-data:/var/lib/postgresql/data
    command: postgres -c timezone=America/Sao_Paulo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_user -d planner_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - network-planner

  test-postgres-planner:
    image: postgres:16.0-alpine
    container_name: test-postgres-planner
    hostname: test-postgres-planner
    environment:
      POSTGRES_USER: api_user_test
      POSTGRES_PASSWORD: api_pass_test
      POSTGRES_DB: planner_db_test
      PGTZ: America/Sao_Paulo
      TZ: America/Sao_Paulo
    ports:
      - "5433:5432"
    volumes:
      - test-postgres-planner-data:/var/lib/postgresql/data
    command: postgres -c timezone=America/Sao_Paulo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_user_test -d planner_db_test"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - network-planner

  # API em modo watch. Opcional: o fluxo padrão roda a API no host (ver README).
  # Inicie com: docker compose --profile api up
  api:
    profiles: ["api"]
    build:
      context: ./planner-api
      dockerfile: Dockerfile
    depends_on:
      postgres-planner:
        condition: service_healthy
    container_name: api-planner
    hostname: api-planner
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: postgres-planner
      DB_PORT: 5432
      DB_USER: api_user
      DB_PASSWORD: api_pass
      DB_NAME: planner_db
      DB_SCHEMA: public
    volumes:
      - ./planner-api:/usr/src/app
      - /usr/src/app/node_modules
    tty: true
    networks:
      - network-planner
